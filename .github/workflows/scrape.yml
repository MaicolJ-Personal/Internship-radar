name: Scrape Workday internships

on:
  schedule:
    # every hour, at minute 15
    - cron: "15 * * * *"
  workflow_dispatch: {} # lets you trigger a run manually from the Actions tab

permissions:
  contents: write

defaults:
  run:
    working-directory: engineering-internship-radar

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Run scraper
        run: python scrape_workday.py

      - name: Commit updated listings
        run: |
          git config user.name "workday-scraper-bot"
          git config user.email "actions@github.com"
          git add listings.json
          git diff --staged --quiet || git commit -m "Update listings.json ($(date -u +'%Y-%m-%dT%H:%M:%SZ'))"
          git push
